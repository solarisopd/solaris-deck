<script>
/* uic 덱 그래픽 움직임 모듈
   - 슬라이드에 들어올 때마다 처음부터 재생한다(다른 쪽에 갔다 오면 다시 재생).
   - Web Animations API 의 'backwards' 채움만 쓰므로 움직임이 끝난 화면 = 최종(정지) 화면이다.
   - 브라우저의 '움직임 줄이기' 설정이면 재생하지 않고 최종 화면을 그대로 보여 준다.
   - 문구·값·좌표는 SVG 원본에서 읽는다(여기에 새 문구·수치를 넣지 않는다).
   그래픽을 추가하려면 MOTIONS 에 재생 함수를 한 줄 더한다. */
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var running = [];      // 재생 중인 Animation / 취소 함수

  function cancelAll() {
    running.forEach(function (a) { try { a.cancel ? a.cancel() : a(); } catch (e) { /* 무시 */ } });
    running = [];
  }
  function anim(el, frames, opts) {
    var a = el.animate(frames, Object.assign({ fill: 'backwards', easing: 'cubic-bezier(.2,.7,.2,1)' }, opts));
    running.push(a);
    return a;
  }
  function num(el, attr) { return parseFloat(el.getAttribute(attr)); }
  function val(el) { return parseFloat(el.textContent.replace(/,/g, '')); }
  function fmt(v) { return Math.round(v).toLocaleString('en-US'); }
  function ease(p) { return 1 - Math.pow(1 - p, 3); }

  /* 숫자 카운트: steps = [{to, dur}, ...] 를 0 에서 차례로 지난다. 끝나면 원래 글자로 복원 */
  function countSeq(el, steps, delay) {
    var finalText = el.textContent, total = steps.reduce(function (s, x) { return s + x.dur; }, 0);
    var start = null, raf = 0, timer = 0, stopped = false;
    function step(ts) {
      if (stopped) return;
      if (start === null) start = ts;
      var e = ts - start, from = 0, acc = 0, out = null;
      for (var i = 0; i < steps.length; i++) {
        if (e <= acc + steps[i].dur) { out = from + (steps[i].to - from) * ease((e - acc) / steps[i].dur); break; }
        acc += steps[i].dur; from = steps[i].to;
      }
      if (e >= total) { el.textContent = finalText; return; }
      el.textContent = fmt(out);
      raf = requestAnimationFrame(step);
    }
    el.textContent = '0';
    timer = setTimeout(function () { raf = requestAnimationFrame(step); }, delay);
    running.push(function () { stopped = true; clearTimeout(timer); cancelAnimationFrame(raf); el.textContent = finalText; });
  }

  /* ── 쪽2 : 온투업 스탁론 잔액 막대그래프 ───────────────────────────── */
  /* 정지 화면(최종) 서식: 곤색 막대 값은 크고 굵게, 주황 막대 값은 작고 가늘게 + 6월 정점 점선·아래 화살표 */
  function styleChart(svg) {
    if (svg.__uicStyled) return;
    svg.__uicStyled = true;
    var T = svg.querySelectorAll('text'), B = svg.querySelectorAll('rect');
    for (var i = 7; i <= 11; i++) { T[i].style.fontSize = 'var(--s16)'; T[i].style.fontWeight = '700'; }
    T[12].style.fontSize = 'var(--s16)'; T[12].style.fontWeight = '400';   // 곤색 값과 같은 크기, 굵기만 보통

    var june = B[4], aug = B[5];
    var yPeak = num(june, 'y'), yTop = num(aug, 'y');
    var xa = num(aug, 'x') + num(aug, 'width') + 13;                // 화살표 x (주황 막대 오른쪽)
    var guide = document.createElementNS(NS, 'line');
    guide.setAttribute('class', 'uic-peak');
    guide.setAttribute('x1', num(june, 'x') + num(june, 'width')); guide.setAttribute('x2', xa + 6);
    guide.setAttribute('y1', yPeak); guide.setAttribute('y2', yPeak);
    guide.setAttribute('stroke', 'var(--mid)'); guide.setAttribute('stroke-width', '1.2'); guide.setAttribute('stroke-dasharray', '5 4');
    var arrow = document.createElementNS(NS, 'g');
    arrow.setAttribute('class', 'uic-drop');
    var shaft = document.createElementNS(NS, 'line');
    shaft.setAttribute('x1', xa); shaft.setAttribute('x2', xa); shaft.setAttribute('y1', yPeak + 3); shaft.setAttribute('y2', yTop - 12);
    shaft.setAttribute('stroke', 'var(--orange)'); shaft.setAttribute('stroke-width', '5');   // 굵은 화살표
    var head = document.createElementNS(NS, 'polygon');
    head.setAttribute('points', (xa - 9) + ',' + (yTop - 14) + ' ' + (xa + 9) + ',' + (yTop - 14) + ' ' + xa + ',' + (yTop + 1));
    head.setAttribute('fill', 'var(--orange)');
    arrow.appendChild(shaft); arrow.appendChild(head);
    svg.insertBefore(guide, svg.querySelector('line[stroke-width="1.2"]').nextSibling || null);
    svg.appendChild(arrow);
  }

  function playPage2(slide) {
    var svg = slide.querySelector('svg.p05-chart');
    if (!svg) return false;
    styleChart(svg);
    var T = svg.querySelectorAll('text');           // 0-1 제목·단위 / 2-6 세로축 / 7-12 막대 값 / 13-18 월
    var L = svg.querySelectorAll('line:not(.uic-peak)');   // 0-3 눈금선 / 4 기준선
    var B = svg.querySelectorAll('rect');           // 6개
    var STEP = 150, GROW = 700, BASE = 300, ORANGE = 1500, PEAK = 0.6;
    var peakVal = val(T[11]), finalVal = val(T[12]);   // 카운트가 글자를 0 으로 바꾸기 전에 원래 값을 읽어 둔다

    [T[0], T[1]].forEach(function (t) { anim(t, [{ opacity: 0 }, { opacity: 1 }], { duration: 400 }); });
    Array.prototype.forEach.call(L, function (l, i) {
      if (l.closest('.uic-drop')) return;
      anim(l, [{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: 60 * i });
    });
    Array.prototype.slice.call(T, 2, 7).concat(Array.prototype.slice.call(T, 13, 19)).forEach(function (t, i) {
      anim(t, [{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: 150 + 30 * i });
    });

    /* 곤색 막대 5개: 바닥에서 자라고 값은 0 에서 올라간다 */
    for (var i = 0; i < 5; i++) {
      var b = B[i], v = T[7 + i], d = BASE + i * STEP, vd = d + GROW - 150;
      b.style.transformBox = 'fill-box'; b.style.transformOrigin = '50% 100%';
      anim(b, [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: GROW, delay: d });
      anim(v, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 300, delay: vd });
      countSeq(v, [{ to: val(v), dur: 650 }], vd);
    }

    /* 주황 막대: 6월 높이까지 솟았다가 내려앉는다. 값은 정점(6월 값)까지 올라갔다 최종 값으로 줄어든다 */
    var aug = B[5], june = B[4], augVal = T[12], d5 = BASE + 5 * STEP;
    var k = num(june, 'height') / num(aug, 'height');
    aug.style.transformBox = 'fill-box'; aug.style.transformOrigin = '50% 100%';
    anim(aug, [
      { transform: 'scaleY(0)', easing: 'cubic-bezier(.2,.7,.2,1)' },
      { transform: 'scaleY(' + k + ')', offset: PEAK, easing: 'cubic-bezier(.45,0,.55,1)' },
      { transform: 'scaleY(1)' }], { duration: ORANGE, delay: d5, easing: 'linear' });
    var hAug = num(aug, 'height'), dyPeak = num(june, 'y') - num(aug, 'y');
    anim(augVal, [
      { transform: 'translateY(' + hAug + 'px)', opacity: 0 },
      { transform: 'translateY(' + dyPeak + 'px)', opacity: 1, offset: PEAK },
      { transform: 'translateY(0px)', opacity: 1 }], { duration: ORANGE, delay: d5, easing: 'linear' });
    countSeq(augVal, [{ to: peakVal, dur: ORANGE * PEAK }, { to: finalVal, dur: ORANGE * (1 - PEAK) }], d5);

    var guide = svg.querySelector('.uic-peak'), drop = svg.querySelector('.uic-drop');
    guide.style.transformBox = 'fill-box'; guide.style.transformOrigin = '0% 50%';
    anim(guide, [{ opacity: 0, transform: 'scaleX(0)' }, { opacity: 1, transform: 'scaleX(1)' }], { duration: 350, delay: d5 + ORANGE * PEAK - 100 });
    anim(drop, [{ opacity: 0, transform: 'translateY(-8px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 400, delay: d5 + ORANGE - 150 });

    /* 오른쪽 시장 인사이트: 제목 → 글머리 순서대로 */
    var hd = d5 + ORANGE;
    var ins = slide.querySelector('.p05-ins');
    if (ins) {
      var rd = hd - 200;
      anim(ins.querySelector('h3'), [{ opacity: 0, transform: 'translateX(18px)' }, { opacity: 1, transform: 'translateX(0)' }], { duration: 450, delay: rd });
      Array.prototype.forEach.call(ins.querySelectorAll('li'), function (li, n) {
        anim(li, [{ opacity: 0, transform: 'translateX(18px)' }, { opacity: 1, transform: 'translateX(0)' }], { duration: 420, delay: rd + 200 + n * 130 });
      });
    }
    var note = slide.querySelector('.note');
    if (note) anim(note, [{ opacity: 0 }, { opacity: 1 }], { duration: 500, delay: hd + 900 });
    return true;
  }

  /* ── 쪽5 : 자금순환구조 도식 (IM 5쪽 자금순환도와 같은 리듬) ──────────
     단계 1→5 를 0.55초 간격으로: 선이 0.6초 동안 그려지고(0 100 → 100 100), 선이 절반쯤 그려질 때 번호 원·문구,
     선이 끝난 뒤 화살촉이 나타난다. 오른쪽 단계 카드는 같은 순서로 켜진다.
     다 그려진 뒤에는 자금 입자(주황 점)가 선을 따라 1→5 로 계속 순환하고 해당 단계 카드에 주황 막대가 표시된다. */
  /* 정지 화면(최종) 서식: IM 자금순환도(im/index.qmd 5쪽)와 같은 도형 규칙.
     - 상자 rx=4(라운드), 영역 배경은 각지게
     - 직선 화살표: 상자에서 8px 띄워 시작하고 화살촉 끝도 목표 상자 8px 앞(화살촉 길이 8, 반폭 4)
     - 원호 화살표: 상자 바닥 8px 아래·상자 안쪽 29px 에서 출발/도착하는 타원 호(IM 비율 rx:ry = 350:90, 끝점 각도 -159°) */
  function styleDiagram5(svg) {
    if (svg.__uicStyled5) return;
    svg.__uicStyled5 = true;
    var kids = Array.prototype.slice.call(svg.children).filter(function (e) { return !e.classList.contains('uic-dot'); });
    var GAP = 8, HEAD = 8, HALF = 4, INSET = 29;
    var rects = kids.filter(function (e) { return e.tagName === 'rect'; });
    rects.slice(1).forEach(function (r) { r.setAttribute('rx', '4'); });

    function headPoints(ax, ay, ux, uy) {              // 꼭짓점 (ax,ay), 진행 방향 단위벡터 u
      var bx = ax - HEAD * ux, by = ay - HEAD * uy, nx = -uy, ny = ux;
      return [ax + ',' + ay, (bx + HALF * nx) + ',' + (by + HALF * ny), (bx - HALF * nx) + ',' + (by - HALF * ny)].join(' ');
    }
    var steps = kids.filter(function (e) { return e.tagName === 'circle'; }).map(function (c) {
      var i = kids.indexOf(c);
      return { n: parseInt(kids[i + 1].textContent, 10), path: kids[i - 2], head: kids[i - 1], circle: c, num: kids[i + 1], label: kids[i + 2] };
    });
    /* 상자 사이 간격을 넓혀 2·4번 화살표 길이를 확보한다(상자 150×64 는 그대로, 간격 53.8 → 84) */
    var BW = 150, G = 84, X0 = 16;
    var top = rects[1], left = rects[2], mid = rects[3], right = rects[4];   // rects[0] 은 CL-Link 영역
    function place(r, x) {
      var i = kids.indexOf(r);
      r.setAttribute('x', x);
      kids[i + 1].setAttribute('x', x + BW / 2); kids[i + 2].setAttribute('x', x + BW / 2);
    }
    place(left, X0); place(mid, X0 + BW + G); place(right, X0 + 2 * (BW + G)); place(top, X0 + BW + G);
    var W = X0 + 3 * BW + 2 * G + X0;
    rects[0].setAttribute('width', W);
    svg.setAttribute('viewBox', '0 0 ' + W + ' 385.51'); svg.setAttribute('width', (W * 0.2645833) + 'mm');
    var xm = X0 + BW + G + BW / 2;                     // 가운데(본점·모계좌) 중심 x
    var yTopBottom = num(top, 'y') + num(top, 'height'), yBoxTop = num(mid, 'y'), yMid = 260;
    var lo = left, hi = right;
    var BRIGHT = 'var(--uic-bright)', BRIGHT_LINE = 'var(--uic-bright-line)';    // 4·5번: 곤색과 구분되는 IM 의 밝은 파랑

    function straight(s, x1, y1, ax, ay) {             // 시작 (x1,y1), 화살촉 꼭짓점 (ax,ay). 선은 꼭짓점 8px 앞에서 끝난다
      var dx = ax - x1, dy = ay - y1, L = Math.sqrt(dx * dx + dy * dy), ux = dx / L, uy = dy / L;
      s.path.setAttribute('x1', x1); s.path.setAttribute('y1', y1);
      s.path.setAttribute('x2', ax - HEAD * ux); s.path.setAttribute('y2', ay - HEAD * uy);
      s.head.setAttribute('points', headPoints(ax, ay, ux, uy));
    }
    function badge(s, cx, cy, lx, ly) {
      s.circle.setAttribute('cx', cx); s.circle.setAttribute('cy', cy); s.num.setAttribute('x', cx); s.num.setAttribute('y', cy);
      s.label.setAttribute('x', lx); s.label.setAttribute('y', ly);
    }
    steps.forEach(function (s) {
      if (s.n === 1) {                                 // 본점 → 모계좌 (아래로)
        var x1c = xm + 14;
        straight(s, x1c, yTopBottom + GAP, x1c, yBoxTop - GAP); badge(s, x1c, 146, x1c + 16, 146);
      } else if (s.n === 5) {                          // 모계좌 → 본점 (위로)
        var x5c = xm - 14;
        straight(s, x5c, yBoxTop - GAP, x5c, yTopBottom + GAP); badge(s, x5c, 146, x5c - 16, 146);
      } else if (s.n === 2) {                          // 모계좌 → 대부대출계좌 (오른쪽)
        var a2 = num(mid, 'x') + BW, b2 = num(right, 'x');
        straight(s, a2 + GAP, yMid, b2 - GAP, yMid); badge(s, (a2 + b2) / 2, yMid, (a2 + b2) / 2, 216);
      } else if (s.n === 4) {                          // 고객증권계좌 → 모계좌 (오른쪽)
        var a4 = num(left, 'x') + BW, b4 = num(mid, 'x');
        straight(s, a4 + GAP, yMid, b4 - GAP, yMid); badge(s, (a4 + b4) / 2, yMid, (a4 + b4) / 2, 216);
      } else {                                                          // 원호(주식 레버리지 투자)
        var yb = num(hi, 'y') + num(hi, 'height') + GAP;
        var sx = num(hi, 'x') + INSET, ex = num(lo, 'x') + num(lo, 'width') - INSET;
        var chord = sx - ex, k = 291 / 350, sinT = Math.sqrt(1 - k * k);
        var rx = chord / (2 * k), ry = rx * 90 / 350;
        s.path.setAttribute('d', 'M' + sx + ',' + yb + ' A' + rx.toFixed(2) + ',' + ry.toFixed(2) + ' 0 0 1 ' + ex + ',' + yb);
        var ang = Math.atan2(ry * (-k), -rx * sinT);                    // 끝점 접선 방향(IM: -159°)
        s.head.setAttribute('points', headPoints(ex, yb, Math.cos(ang), Math.sin(ang)));
        var cy = yb + ry * (1 - sinT), cx = (sx + ex) / 2;
        s.circle.setAttribute('cx', cx); s.circle.setAttribute('cy', cy);
        s.num.setAttribute('x', cx); s.num.setAttribute('y', cy);
        s.label.setAttribute('x', cx); s.label.setAttribute('y', cy + 25);
      }
      if (s.n === 4 || s.n === 5) {                    // 곤색(1·2·3)과 구분: IM 5쪽과 같은 밝은 파랑
        s.circle.setAttribute('fill', BRIGHT); s.label.setAttribute('fill', BRIGHT);
        s.path.setAttribute('stroke', BRIGHT_LINE); s.head.setAttribute('fill', BRIGHT_LINE);
      }
    });
  }

  function playPage5(slide) {
    var svg = slide.querySelector('svg.k05-fig');
    if (!svg) return false;
    styleDiagram5(svg);
    var kids = Array.prototype.slice.call(svg.children).filter(function (e) { return !e.classList.contains('uic-dot'); });
    var steps = kids.filter(function (e) { return e.tagName === 'circle'; }).map(function (c) {
      var i = kids.indexOf(c);
      return { n: parseInt(kids[i + 1].textContent, 10), path: kids[i - 2], head: kids[i - 1], circle: c, num: kids[i + 1], label: kids[i + 2] };
    }).sort(function (a, b) { return a.n - b.n; });
    if (steps.length !== 5) return false;
    var cards = Array.prototype.slice.call(slide.querySelectorAll('.k05-step'));
    var STEP0 = 650, STEP = 550, DRAW = 600;

    /* 영역·상자: 먼저 차례로 나타난다 */
    var rects = kids.filter(function (e) { return e.tagName === 'rect'; });
    rects.forEach(function (r, i) {
      var group = [r, kids[kids.indexOf(r) + 1]];
      if (i > 0) group.push(kids[kids.indexOf(r) + 2]);
      group.forEach(function (g) { anim(g, [{ opacity: 0 }, { opacity: 1 }], { duration: 350, delay: 60 * i }); });
    });

    steps.forEach(function (s, k) {
      var t = STEP0 + k * STEP;
      s.path.setAttribute('pathLength', '100');
      anim(s.path, [{ strokeDasharray: '0 100' }, { strokeDasharray: '100 100' }], { duration: DRAW, delay: t, easing: 'linear' });
      s.head.style.transformBox = 'fill-box'; s.head.style.transformOrigin = '50% 50%';
      anim(s.head, [{ opacity: 0, transform: 'scale(.3)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 180, delay: t + DRAW - 60 });
      [s.circle, s.num, s.label].forEach(function (e) { anim(e, [{ opacity: 0 }, { opacity: 1 }], { duration: 250, delay: t + 250, easing: 'ease-out' }); });
      if (cards[k]) anim(cards[k], [{ opacity: 0.2, transform: 'translateX(24px)' }, { opacity: 1, transform: 'translateX(0)' }], { duration: 450, delay: t + 250 });
    });

    /* 순환 입자: 다 그려진 뒤 시작 */
    var NS2 = 'http://www.w3.org/2000/svg';
    var dots = svg.__uicDots;
    if (!dots) {
      dots = steps.map(function () {
        var d = document.createElementNS(NS2, 'circle');
        d.setAttribute('class', 'uic-dot'); d.setAttribute('r', '4.5'); d.setAttribute('fill', 'var(--orange)'); d.setAttribute('opacity', '0');
        svg.appendChild(d); return d;
      });
      svg.__uicDots = dots;
    }
    var lens = steps.map(function (s) { return s.path.getTotalLength(); });
    var W = 800, GAP = 620, CYCLE = 5 * GAP + W + 900;   // 각 단계 이동 0.8초, 단계 간격 0.62초, 한 바퀴 뒤 0.9초 쉼
    var startAt = STEP0 + 4 * STEP + DRAW + 500, raf = 0, timer = 0, stopped = false, on = [false, false, false, false, false], t0 = 0;
    cards.forEach(function (c) { c.style.transition = 'box-shadow .25s'; });
    function frame(ts) {
      if (stopped) return;
      if (!t0) t0 = ts;
      var e = (ts - t0) % CYCLE;
      steps.forEach(function (s, k) {
        var local = e - k * GAP, active = local >= 0 && local < W;
        if (active) {
          var p = local / W, q = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
          var pt = s.path.getPointAtLength(q * lens[k]);
          dots[k].setAttribute('cx', pt.x); dots[k].setAttribute('cy', pt.y);
          dots[k].setAttribute('opacity', Math.min(1, p * 8, (1 - p) * 8).toFixed(2));
        } else { dots[k].setAttribute('opacity', '0'); }
        if (active !== on[k]) { on[k] = active; if (cards[k]) cards[k].style.boxShadow = active ? 'inset 6px 0 0 0 var(--orange)' : 'none'; }
      });
      raf = requestAnimationFrame(frame);
    }
    timer = setTimeout(function () { raf = requestAnimationFrame(frame); }, startAt);
    running.push(function () {
      stopped = true; clearTimeout(timer); cancelAnimationFrame(raf);
      dots.forEach(function (d) { d.setAttribute('opacity', '0'); });
      cards.forEach(function (c) { c.style.boxShadow = 'none'; });
    });
    return true;
  }

  /* ── 쪽9 : 귀사 원금 보호 피라미드 ─────────────────────────────────────
     표 → 피라미드가 아래에서부터(1 종목관리 → 2 계좌 직접평가 → 3 손실보전 → 귀사 원금) 쌓이고,
     다 쌓인 뒤 충격 고리가 1층에서 크게 퍼지고 2층·3층에서 작아지며 귀사 원금에는 닿지 않는다(반복). 새 문구·수치 없음 */
  function playPage9(slide) {
    var svg = slide.querySelector('svg.k09-fig');
    if (!svg) return false;
    var R = svg.querySelectorAll('rect'), P = svg.querySelectorAll('polygon'), S = svg.querySelectorAll('path'), T = svg.querySelectorAll('text');
    /* DOM 순서: rect 0 귀사 원금 띠 / 1 손실보전 / 2 계좌 직접평가 / 3 높이 0 / 4 종목관리
                 polygon 0 귀사 원금 삼각형 / 1 손실보전 / 2 계좌 / 3 종목관리, path 방패 0 손실보전 / 1 계좌 / 2 종목관리
                 text 0 귀사 원금 / 1-2 손실보전(번호·문구) / 3-4 계좌 / 5-6 종목관리 */
    var layers = [
      { band: R[4], poly: P[3], shield: S[2], texts: [T[5], T[6]], amp: 1.10, ring: 18 },     // 1 종목관리 (맨 아래)
      { band: R[2], poly: P[2], shield: S[1], texts: [T[3], T[4]], amp: 1.07, ring: 13 },     // 2 계좌 직접평가
      { band: R[1], poly: P[1], shield: S[0], texts: [T[1], T[2]], amp: 1.04, ring: 8 },      // 3 손실보전
      { band: R[0], poly: P[0], shield: null, texts: [T[0]], amp: 1, ring: 0 }                // 귀사 원금 (맨 위)
    ];
    var T0 = 350, STEP = 550;

    /* 왼쪽 표: 제목 → 행 순서대로 */
    var sub = slide.querySelector('.k09-sub');
    if (sub) anim(sub, [{ opacity: 0 }, { opacity: 1 }], { duration: 350 });
    Array.prototype.forEach.call(slide.querySelectorAll('.k09-tbl tr'), function (tr, i) {
      anim(tr, [{ opacity: 0 }, { opacity: 1 }], { duration: 380, delay: 150 + i * 130 });
    });

    /* 피라미드: 아래에서부터 쌓인다 */
    layers.forEach(function (L, i) {
      var t = T0 + i * STEP, top = i === 3;
      L.poly.style.transformBox = 'fill-box'; L.poly.style.transformOrigin = '50% 50%';
      anim(L.poly, [{ opacity: 0, transform: 'translateY(' + (top ? -30 : 26) + 'px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 500, delay: t });
      L.band.style.transformBox = 'fill-box'; L.band.style.transformOrigin = '0% 50%';
      anim(L.band, [{ transform: 'scaleX(0)', opacity: 0.4 }, { transform: 'scaleX(1)', opacity: 1 }], { duration: 500, delay: t + 100 });
      if (L.shield) {
        L.shield.style.transformBox = 'fill-box'; L.shield.style.transformOrigin = '50% 50%';
        anim(L.shield, [{ opacity: 0, transform: 'scale(.3)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 280, delay: t + 380 });
      }
      L.texts.forEach(function (x) { anim(x, [{ opacity: 0, transform: 'translateX(-10px)' }, { opacity: 1, transform: 'translateX(0)' }], { duration: 350, delay: t + 420 }); });
    });

    /* 아래 문장 */
    var endBuild = T0 + 3 * STEP + 900;
    var call = slide.querySelector('.k09-callout');
    if (call) anim(call, [{ opacity: 0 }, { opacity: 1 }], { duration: 500, delay: endBuild - 300 });

    /* 충격 고리: 층마다 왼쪽 비스듬한 변의 가운데에 만든다(한 번만) */
    var NS2 = 'http://www.w3.org/2000/svg';
    var rings = svg.__uicRings;
    if (!rings) {
      rings = layers.slice(0, 3).map(function (L) {
        var pts = L.poly.getAttribute('points').trim().split(/\s+/).map(function (p) { return p.split(',').map(Number); });
        var cx = (pts[0][0] + pts[3][0]) / 2, cy = (pts[0][1] + pts[3][1]) / 2;       // 왼쪽 변 가운데(위-왼 · 아래-왼)
        var c = document.createElementNS(NS2, 'circle');
        c.setAttribute('class', 'uic-ring'); c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', L.ring);   // 최대 크기로 두고 배율만 바꾼다(브라우저 호환)
        c.setAttribute('fill', 'none'); c.setAttribute('stroke', 'var(--red)'); c.setAttribute('stroke-width', '2.5'); c.setAttribute('opacity', '0');
        c.setAttribute('vector-effect', 'non-scaling-stroke');
        c.style.transformBox = 'fill-box'; c.style.transformOrigin = '50% 50%';
        svg.appendChild(c); return c;
      });
      svg.__uicRings = rings;
    }
    var CYCLE = 4600, timers = [];
    function shock() {
      layers.slice(0, 3).forEach(function (L, i) {
        var d = i * 520;
        var a = rings[i].animate([{ opacity: 0.95, transform: 'scale(' + (3 / L.ring) + ')' }, { opacity: 0, transform: 'scale(1)' }], { duration: 750, delay: d, easing: 'ease-out', fill: 'none' });
        var b = L.poly.animate([{ transform: 'scale(1)' }, { transform: 'scale(' + L.amp + ')', offset: 0.35 }, { transform: 'scale(1)' }], { duration: 650, delay: d + 60, easing: 'ease-in-out', fill: 'none' });
        var c = L.band.animate([{ opacity: 1 }, { opacity: 0.72 }, { opacity: 1 }], { duration: 650, delay: d + 60, easing: 'ease-in-out', fill: 'none' });
        running.push(a, b, c);
      });
      timers.push(setTimeout(shock, CYCLE));
    }
    timers.push(setTimeout(shock, endBuild + 500));
    running.push(function () { timers.forEach(clearTimeout); rings.forEach(function (r) { r.setAttribute('opacity', '0'); }); });
    return true;
  }

  /* ── 쪽12 : 론칭 일정 타임라인 ─────────────────────────────────────────
     전체 모양(선·카드·문장)은 처음부터 그대로 두고, 번호 원 1~5(숫자 포함)는 처음에 옅게 깔려 있다가
     차례로 제 색으로 진해지며 들어온 뒤 멈춘다. 빛무리·크기 변화 없이 원 자체의 농도만 바뀐다. 새 문구·수치 없음 */
  function playPage12(slide) {
    var tl = slide.querySelector('.k12-tl');
    if (!tl) return false;
    var dots = tl.querySelectorAll('.k12-n');
    var T0 = 600, STEP = 1000, DUR = 900;               // 첫 원은 0.6초 뒤 시작, 1초 간격, 한 원이 들어오는 데 0.9초
    for (var i = 0; i < dots.length; i++) {
      anim(dots[i], [{ opacity: 0.18 }, { opacity: 1 }], { duration: DUR, delay: T0 + i * STEP, easing: 'ease-out' });
    }
    return true;
  }

  var MOTIONS = [playPage2, playPage5, playPage9, playPage12];

  function play(slide) {
    cancelAll();
    if (reduce || !slide) return;
    for (var i = 0; i < MOTIONS.length; i++) { if (MOTIONS[i](slide)) return; }
  }
  function initStatic() {
    Array.prototype.forEach.call(document.querySelectorAll('svg.p05-chart'), styleChart);
    Array.prototype.forEach.call(document.querySelectorAll('svg.k05-fig'), styleDiagram5);
  }

  /* 이동화살표 강조: 이동한 방향 화살표는 진하게, 반대는 옅게(샘플 im 덱과 같은 동작 — 색은 theme/uic.scss) */
  function trackDirection() {
    var el = document.querySelector('.reveal'), prev = Reveal.getIndices().h;
    Reveal.on('slidechanged', function (e) {
      var h = typeof e.indexh === 'number' ? e.indexh : Reveal.getIndices().h;
      if (h > prev) { el.classList.add('dir-next'); el.classList.remove('dir-prev'); }
      else if (h < prev) { el.classList.add('dir-prev'); el.classList.remove('dir-next'); }
      prev = h;
    });
  }

  function boot() {
    if (!window.Reveal) { return setTimeout(boot, 50); }
    trackDirection();
    initStatic();
    Reveal.on('ready', function (e) { initStatic(); play(e.currentSlide); });
    Reveal.on('slidechanged', function (e) { play(e.currentSlide); });
    if (Reveal.isReady && Reveal.isReady()) { play(Reveal.getCurrentSlide()); }
  }
  boot();
  window.UICMotion = { replay: function () { play(Reveal.getCurrentSlide()); } };
})();
</script>
